name: Temporary CI fix

on:
  push:
    branches:
      - ci-fix-v0.3.1

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Synchronize graph stats test
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('web/tests/e2e/source-control.spec.ts')
          text = path.read_text()
          test_name = "test('branch picker, repository filters, list view, and graph stats use direct pane controls'"
          start = text.index(test_name)
          needle = """  await page.goto(app.url)\n  await page.locator('[data-section=\"repository\"]').click()\n  await page.locator('[data-section=\"graph\"]').click()\n"""
          index = text.index(needle, start)
          insertion = "  await page.getByRole('button', { name: 'Refresh Graph' }).click()\n"
          if text.startswith(insertion, index + len(needle)):
              raise SystemExit('target already patched')
          text = text[: index + len(needle)] + insertion + text[index + len(needle) :]
          path.write_text(text)
          PY
          git diff --check
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/tests/e2e/source-control.spec.ts
          git commit -m 'test: synchronize graph stats on hosted runners'
          git push origin HEAD:ci-fix-v0.3.1
