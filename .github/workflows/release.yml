name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  GOMODCACHE: ${{ github.workspace }}/go-mod-cache

jobs:
  preflight:
    name: Verify release provenance
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify annotated tag and successful main CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(git cat-file -t "$GITHUB_REF_NAME")" = tag
          commit="$(git rev-parse "$GITHUB_REF_NAME^{}")"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$commit" origin/main
          run_url="$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f head_sha="$commit" \
            -f branch=main \
            -f event=push \
            -f status=success \
            -f per_page=1 \
            --jq '.workflow_runs[0].html_url // empty')"
          if [[ -z "$run_url" ]]; then
            echo "No successful main CI run exists for $commit" >&2
            exit 1
          fi
          echo "Release commit: $commit"
          echo "Verified CI: $run_url"

  prepare:
    name: Prepare release inputs
    needs: preflight
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
        with:
          version: 11.24.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Build embedded frontend and verify licenses
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web build
          node scripts/generate-third-party-licenses.mjs
          git diff --exit-code -- THIRD_PARTY_LICENSES.txt
      - name: Download Go modules
        run: go mod download
      - name: Package npm launcher
        run: node scripts/package-npm.mjs "${GITHUB_REF_NAME#v}" dist-npm
      - name: Upload embedded frontend
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: embedded-web
          path: internal/webui/dist/
          if-no-files-found: error
          retention-days: 1
      - name: Upload npm launcher
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-release
          path: dist-npm/*.tgz
          if-no-files-found: error
          retention-days: 1
      - name: Upload Go modules
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-modules
          path: go-mod-cache/
          if-no-files-found: error
          retention-days: 1

  package-linux:
    name: Package Linux
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: embedded-web
          path: internal/webui/dist
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: go-modules
          path: go-mod-cache
      - name: Package Linux assets
        env:
          GITNA_USE_PREBUILT_WEB: "1"
        run: ./scripts/package.sh "$GITHUB_REF_NAME" dist
      - name: Smoke test exact Linux release binary
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir release-smoke
          tar -xzf "dist/gitna_${version}_linux_x64.tar.gz" -C release-smoke
          ./scripts/smoke-release.sh "$PWD/release-smoke/gitna" "$version"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-release-assets
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  package-macos:
    name: Package macOS (${{ matrix.asset_arch }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: darwin-arm64
            asset_arch: arm64
          - runner: macos-15-intel
            target: darwin-x64
            asset_arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: embedded-web
          path: internal/webui/dist
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: go-modules
          path: go-mod-cache
      - name: Package macOS asset
        env:
          GITNA_USE_PREBUILT_WEB: "1"
        run: ./scripts/package.sh "$GITHUB_REF_NAME" dist "${{ matrix.target }}"
      - name: Smoke test exact macOS release binary
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir release-smoke
          tar -xzf "dist/gitna_${version}_darwin_${{ matrix.asset_arch }}.tar.gz" -C release-smoke
          ./scripts/smoke-release.sh "$PWD/release-smoke/gitna" "$version"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-${{ matrix.asset_arch }}-release-assets
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  package-windows:
    name: Package Windows
    needs: prepare
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: embedded-web
          path: internal/webui/dist
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: go-modules
          path: go-mod-cache
      - name: Package Windows asset
        shell: pwsh
        env:
          GITNA_USE_PREBUILT_WEB: "1"
        run: ./scripts/package.ps1 $env:GITHUB_REF_NAME dist
      - name: Smoke test exact Windows release binary
        shell: pwsh
        run: |
          $Version = $env:GITHUB_REF_NAME.TrimStart("v")
          Expand-Archive "dist/gitna_${Version}_windows_x64.zip" release-smoke
          if ((& ./release-smoke/gitna.exe --version) -ne $Version) {
            throw "packaged binary reported the wrong version"
          }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-release-assets
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish release
    needs:
      - prepare
      - package-linux
      - package-macos
      - package-windows
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "*-release-assets"
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-release
          path: dist
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Generate checksums and smoke test npm launcher
        env:
          GITNA_CACHE_DIR: ${{ runner.temp }}/gitna-npm-cache
        run: |
          version="${GITHUB_REF_NAME#v}"
          (cd dist && sha256sum gitna_* > checksums.txt)
          mkdir npm-smoke
          npm install --prefix npm-smoke "./dist/gitna-${version}.tgz"
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist >release-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          export GITNA_RELEASE_BASE=http://127.0.0.1:4173
          test "$(npm-smoke/node_modules/.bin/gitna --version)" = "$version"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" dist/gitna_* dist/checksums.txt \
              --verify-tag \
              --generate-notes \
              --title "Gitna ${GITHUB_REF_NAME#v}"
          fi
      - name: Publish npm package
        run: |
          version="${GITHUB_REF_NAME#v}"
          npm publish "./dist/gitna-${version}.tgz" --access public --provenance
