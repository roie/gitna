name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.24.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # zizmor: ignore[cache-poisoning] pinned release toolchain
        with:
          node-version: 24
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Install frontend dependencies
        run: pnpm --dir web install --frozen-lockfile
      - name: Verify frontend and release sources
        run: |
          pnpm --dir web check
          pnpm --dir web lint
          pnpm --dir web test
          pnpm --dir web format:check
          web/node_modules/.bin/tsc -p tsconfig.json
          web/node_modules/.bin/oxfmt --config web/.oxfmtrc.json --check scripts/generate-third-party-licenses.mjs scripts/package-npm.mjs npm/gitna
          node --test npm/gitna/test/platform.test.mjs
      - name: Verify embedded frontend and licenses
        run: |
          pnpm --dir web build
          node scripts/generate-third-party-licenses.mjs
          git diff --exit-code -- THIRD_PARTY_LICENSES.txt
      - name: Verify Go application
        run: |
          go vet ./...
          go test ./...
          go test -race ./...

  package-linux:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.24.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # zizmor: ignore[cache-poisoning] pinned release toolchain
        with:
          node-version: 24
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Package Linux assets
        run: ./scripts/package.sh "${GITHUB_REF_NAME}" dist
      - name: Verify packaged versions
        run: | # zizmor: ignore[adhoc-packages]
          version="${GITHUB_REF_NAME#v}"
          mkdir release-smoke
          tar -xzf "dist/gitna_${version}_linux_x64.tar.gz" -C release-smoke
          test "$(release-smoke/gitna --version)" = "$version"
      - name: Install Chromium
        run: pnpm --dir web exec playwright install --with-deps chromium
      - name: Smoke test exact Linux release binary
        env:
          GITNA_E2E_BINARY: ${{ github.workspace }}/release-smoke/gitna
        run: pnpm --dir web test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-release-assets
          path: dist/*.tar.gz
          if-no-files-found: error

  package-macos:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: darwin-arm64
            asset_arch: arm64
          - runner: macos-15-intel
            target: darwin-x64
            asset_arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.24.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # zizmor: ignore[cache-poisoning] pinned release toolchain
        with:
          node-version: 24
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Package macOS asset
        run: ./scripts/package.sh "${GITHUB_REF_NAME}" dist "${{ matrix.target }}"
      - name: Smoke test exact macOS release binary
        run: | # zizmor: ignore[adhoc-packages]
          version="${GITHUB_REF_NAME#v}"
          mkdir release-smoke
          tar -xzf "dist/gitna_${version}_darwin_${{ matrix.asset_arch }}.tar.gz" -C release-smoke
          ./scripts/smoke-release.sh "$PWD/release-smoke/gitna" "$version"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-${{ matrix.asset_arch }}-release-assets
          path: dist/*.tar.gz
          if-no-files-found: error

  package-windows:
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.24.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # zizmor: ignore[cache-poisoning] pinned release toolchain
        with:
          node-version: 24
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Package Windows asset
        shell: pwsh
        run: ./scripts/package.ps1 $env:GITHUB_REF_NAME dist
      - name: Verify packaged versions
        shell: pwsh
        run: | # zizmor: ignore[adhoc-packages]
          $Version = $env:GITHUB_REF_NAME.TrimStart("v")
          Expand-Archive "dist/gitna_${Version}_windows_x64.zip" release-smoke
          if ((& ./release-smoke/gitna.exe --version) -ne $Version) {
            throw "packaged binary reported the wrong version"
          }
      - name: Install Chromium
        run: pnpm --dir web exec playwright install chromium
      - name: Smoke test exact Windows release binary
        shell: pwsh
        run: |
          $env:GITNA_E2E_BINARY = (Resolve-Path ./release-smoke/gitna.exe).Path
          pnpm --dir web test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-release-assets
          path: dist/*.zip
          if-no-files-found: error

  publish:
    needs:
      - package-linux
      - package-macos
      - package-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: "*-release-assets"
          path: dist
          merge-multiple: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # zizmor: ignore[cache-poisoning] pinned npm publisher
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Generate checksums
        working-directory: dist
        run: sha256sum gitna_* > checksums.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/gitna_* dist/checksums.txt --verify-tag --generate-notes --title "Gitna ${GITHUB_REF_NAME#v}"
      - name: Package and smoke test npm launcher
        env:
          GITNA_CACHE_DIR: ${{ runner.temp }}/gitna-npm-cache
        run: | # zizmor: ignore[adhoc-packages]
          version="${GITHUB_REF_NAME#v}"
          node scripts/package-npm.mjs "$version" dist
          mkdir npm-smoke
          npm install --prefix npm-smoke "./dist/gitna-${version}.tgz"
          test "$(npm-smoke/node_modules/.bin/gitna --version)" = "$version"
      - name: Publish npm package
        run: |
          version="${GITHUB_REF_NAME#v}"
          npm publish "./dist/gitna-${version}.tgz" --access public --provenance
      - name: Hide incomplete GitHub release
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --draft
          fi
